<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Copy Desk">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="app.css">
<title>Copy Desk · PAPER</title>
<script>
window.COPYDESK_BASE = (function(){
  var p = location.pathname;
  if (p.endsWith('/')) return p;
  if (p.endsWith('.html')) return p.replace(/[^/]+$/, '');
  return p.replace(/\/?$/, '/');
})();
</script>
</head>
<body>
<div id="err" class="err" hidden></div>
<main id="view">
<div class="nav">
  <div class="title">Copy</div>
  <span class="pill paper">PAPER</span>
  <span class="pill live off">…</span>
</div>
<section class="balwrap">
  <div class="bal skel-line skel-bal" aria-hidden="true"></div>
  <div class="delta skel-line skel-delta" aria-hidden="true"></div>
</section>
<div class="chartwrap skel-chart" aria-hidden="true"><div class="skel-block"></div></div>
<div class="ranges"><span class="skel-chip"></span><span class="skel-chip"></span><span class="skel-chip"></span></div>
<div class="stats">
  <div class="stat skel-stat"><span class="skel-line"></span><b class="skel-line"></b></div>
  <div class="stat skel-stat"><span class="skel-line"></span><b class="skel-line"></b></div>
  <div class="stat skel-stat"><span class="skel-line"></span><b class="skel-line"></b></div>
</div>
<div class="hlabel">Activity</div>
<div class="list feed-slot"><div class="row skel-row"><div class="m"><b class="skel-line"></b><span class="skel-line"></span></div><div class="v skel-line"></div></div></div>
</main>
<div id="sheet" class="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div id="sheet-body"></div>
  </div>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="home" class="on" type="button">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>Home</span>
  </button>
  <button data-tab="traders" type="button">
    <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3 3-5 6-5s6 2 6 5M12 20c0-3 2-5 4-5 3 0 6 2 6 5"/></svg>
    <span>Traders</span>
  </button>
  <button data-tab="positions" type="button">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span>Positions</span>
  </button>
  <button data-tab="activity" type="button">
    <svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
    <span>Activity</span>
  </button>
  <button data-tab="settings" type="button">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span>Settings</span>
  </button>
</nav>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
</html>
